name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          xcodebuild test \
            -project Huaci.xcodeproj \
            -scheme Huaci \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
